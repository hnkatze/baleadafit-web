<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="baleadaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="macroProtein" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="macroFat" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Isotipo: Baleada estilizada en semicirculo/doblada con graficos de macronutrientes y chispa IA -->
  <g transform="translate(10, 8)">
    <!-- Base tortillla/baleada doblada (arco suave exterior) -->
    <path d="M 12 48 C 12 22, 34 8, 54 8 C 58 8, 62 9, 65 11" fill="none" stroke="#E2E8F0" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Macro Arc 1: Carbs/Base Baleada (Emerald) -->
    <path d="M 14 46 C 14 26, 30 14, 46 12" fill="none" stroke="url(#baleadaGrad)" stroke-width="7" stroke-linecap="round"/>
    
    <!-- Macro Arc 2: Protein (Blue) -->
    <path d="M 52 13 C 58 15, 62 18, 65 23" fill="none" stroke="url(#macroProtein)" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Macro Arc 3: Healthy Fats (Amber) -->
    <path d="M 66 28 C 68 33, 68 39, 65 44" fill="none" stroke="url(#macroFat)" stroke-width="5" stroke-linecap="round"/>

    <!-- Silueta interior de la baleada doblada con relleno cremoso/nutricional -->
    <path d="M 18 48 C 22 34, 38 24, 52 30 C 58 33, 62 40, 60 48 Z" fill="#ECFDF5" stroke="#10B981" stroke-width="2.5" stroke-linejoin="round"/>
    
    <!-- Linea de pliegue de la tortilla típica -->
    <path d="M 18 48 Q 38 52 58 48" stroke="#059669" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Chispa Starburst IA (Verde Menta vibrante) en la cúspide -->
    <g transform="translate(48, 6)">
      <!-- 4-point AI sparkle -->
      <path d="M 8 0 Q 8 8 0 8 Q 8 8 8 16 Q 8 8 16 8 Q 8 8 8 0 Z" fill="#34D399" filter="url(#glow)"/>
      <circle cx="8" cy="8" r="2" fill="#FFFFFF"/>
    </g>
    <!-- Pequena chispa secundaria -->
    <g transform="translate(62, 16)">
      <path d="M 4 0 Q 4 4 0 4 Q 4 4 4 8 Q 4 4 8 4 Q 4 4 4 0 Z" fill="#10B981"/>
    </g>
  </g>

  <!-- Logotipo BaleadaFit + PRO -->
  <g transform="translate(94, 25)">
    <!-- Texto "Baleada" en Verde Oscuro #065F46 seminegrita -->
    <text x="0" y="27" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#065F46" letter-spacing="-0.8">Baleada<tspan fill="#10B981" font-weight="800">Fit</tspan></text>
    
    <!-- Badge Clinician / Pro elegante -->
    <rect x="156" y="8" width="54" height="20" rx="6" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
    <text x="183" y="22" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="700" fill="#059669" text-anchor="middle" letter-spacing="0.5">PRO</text>
    
    <!-- Subtitulo clínico -->
    <text x="1" y="42" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#64748B" letter-spacing="0.2">NUTRICIÓN CLÍNICA &amp; IA</text>
  </g>
</svg>