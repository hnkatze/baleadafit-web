<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
  </defs>
  <!-- Clean light background canvas -->
  <rect width="400" height="400" rx="40" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />
  
  <!-- Iconic Monogram Emblem: B + Folded Tortilla + Pulse -->
  <g transform="translate(200, 155)">
    <!-- Base folded tortilla curve (semicircle arc) in clinical slate -->
    <path d="M -80, 10 A 80 80 0 0 1 80 10" fill="none" stroke="#0f172a" stroke-width="16" stroke-linecap="round" />
    
    <!-- Upper folded flap forming an aerodynamic curve -->
    <path d="M -70, -5 Q 0 -65 70, -5" fill="none" stroke="#0f172a" stroke-width="14" stroke-linecap="round" />
    
    <!-- Central pulse vector in emerald mint representing clinical nutrition & fitness -->
    <polyline points="-45,5 -15,5 0,-30 15,22 30,5 50,5" fill="none" stroke="url(#emeraldGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  
  <!-- Typography calibrated for luxury sportswear / clinical merchandise -->
  <text x="200" y="292" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="32" font-weight="800" fill="#0f172a" text-anchor="middle" letter-spacing="1.5">
    BALEADA<tspan fill="#10b981">FIT</tspan>
  </text>
  
  <!-- Minimalist descriptor -->
  <rect x="145" y="316" width="110" height="24" rx="12" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1" />
  <text x="200" y="332" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#065f46" text-anchor="middle" letter-spacing="3">
    CLINIC
  </text>
</svg>