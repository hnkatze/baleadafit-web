name: CI

# main es público y sin protección: este workflow es la única red que impide
# que un push deje el árbol roto en silencio.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: tests, lint y build
    # Runner pinneado: `ubuntu-latest` migra a Ubuntu 26 en octubre de 2026 y
    # no queremos que la CI cambie de sistema operativo sola.
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Tests
        run: npm test

      - name: Lint
        run: npm run lint

      # API_URL no hace falta en el build: las pantallas que leen la API son
      # dinámicas y la URL por defecto es la local. El build corre el typecheck.
      - name: Build
        run: npm run build
